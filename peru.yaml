imports: 
  fuzzy-sys: src 
  forgit: .

git module fuzzy-sys:
  url: https://github.com/NullSense/fuzzy-sys
  # license: UNLICENSE [src/UNLICENSE.fuzzy-sys]
  # fsystemctl # abstract: fzf wrapper for systemctl
  move:
    fuzzy-sys.plugin.zsh: fuzzy-sys
    UNLICENSE: UNLICENSE.fuzzy-sys
  executable: fuzzy-sys
  pick:
    - fuzzy-sys
    - UNLICENSE.fuzzy-sys

git module forgit:
  url: https://github.com/wfxr/forgit
  # license: MIT [bin/UNLICENSE.forgit]
  # git-forgit # abstract: a utility tool powered by fzf for using git interactively
  move:
    LICENSE: bin/LICENSE.forgit
  pick:
    - bin/git-forgit
    - completions/git-forgit.bash
    - bin/LICENSE.forgit

